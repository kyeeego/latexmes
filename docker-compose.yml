version: '3'

services:
  latexmes:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      - PG_HOST=latexmes_pg
      - PG_USER=admin
      - PG_PASS=admin
      - PG_PORT=5432
      - PG_NAME=latexmes
      - PORT=8081

  db:
    image: 'postgres:latest'
    container_name: latexmes_pg
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=latexmes